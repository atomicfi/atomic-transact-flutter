name: publish to pub.dev

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set version
        run: |
          NEW_VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          NEW_VERSION="${NEW_VERSION#v}"
          ./scripts/bump_version.sh --version "$NEW_VERSION"

      - name: Verify version sync
        run: |
          PUBSPEC_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          DART_VERSION=$(grep "packageVersion" lib/src/version.dart | sed "s/.*'\(.*\)'.*/\1/")
          if [ "$PUBSPEC_VERSION" != "$DART_VERSION" ]; then
            echo "::error::Version mismatch: pubspec.yaml ($PUBSPEC_VERSION) != lib/src/version.dart ($DART_VERSION)"
            exit 1
          fi
          echo "Versions in sync: $PUBSPEC_VERSION"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: dart pub get

      - name: Setup Pub credentials
        run: |
          mkdir -p $XDG_CONFIG_HOME/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > "$XDG_CONFIG_HOME/dart/pub-credentials.json"

      - name: Publish Package
        run: dart pub publish -f

  sync_linear_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_FLUTTER }}
          command: sync
          name: Flutter ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          links: |
            Source release=${{ github.event.release.html_url }}

      - uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_FLUTTER }}
          command: complete
          version: ${{ steps.release.outputs.version }}
